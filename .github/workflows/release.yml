# Builds the Windows installer when a version tag (v*) is pushed and attaches
# it to a draft GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-model
      - run: pnpm build:extension
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Nudgy ${{ github.ref_name }}
          releaseBody: See RELEASE_NOTES.md. Windows may warn the installer is unsigned; click More info → Run anyway.
          releaseDraft: true
          args: --bundles nsis
