[package]
name = "nudgy-activity"
description = "Activity watchers: foreground window, idle, lock, fullscreen, mic, browser bridge, encrypted event store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nudgy-shared = { path = "../../packages/shared" }
nudgy-tomcrypt = { path = "../tomcrypt" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
active-win-pos-rs = "0.11"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
