[package]
name = "nudgy-voice"
description = "Speaks lines with the Windows built-in voices (WinRT SpeechSynthesizer), offline and free"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_System_Com",
] }

[dev-dependencies]
nudgy-lines = { path = "../lines" }
nudgy-shared = { path = "../../packages/shared" }
serde_json.workspace = true
